services:
  redis:
    image: redis:alpine
    container_name: redis

  bookmark_service:
    image: bookmark_management:dev
    build: .
    restart: always
    container_name: bookmark_service
    depends_on:
      - redis
    env_file:
      - ./bookmark_service/.env

  portal:
    image: ebvn/bookmark-app-portal:dev
    container_name: portal

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - bookmark_service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro